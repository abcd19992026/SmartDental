<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
    <title>Demo Requested — SmartDentist</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #070b14;
        background-image: 
          radial-gradient(circle at 50% 20%, rgba(20, 184, 166, 0.15) 0%, transparent 60%),
          radial-gradient(circle at 80% 80%, rgba(14, 165, 233, 0.08) 0%, transparent 50%);
        color: #f8fafc;
        line-height: 1.6;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        max-width: 520px;
        width: 100%;
        text-align: center;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(45, 212, 191, 0.3);
        border-radius: 24px;
        padding: 48px 36px;
        box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 40px rgba(20, 184, 166, 0.15);
      }
      .check-icon {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: rgba(20, 184, 166, 0.15);
        border: 1px solid rgba(45, 212, 191, 0.4);
        color: #2dd4bf;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        margin-bottom: 24px;
        box-shadow: 0 0 25px rgba(20, 184, 166, 0.3);
      }
      h1 {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 28px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -0.02em;
      }
      p {
        margin-top: 14px;
        color: #94a3b8;
        font-size: 15.5px;
      }
      .contact-note {
        margin-top: 20px;
        padding: 16px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.06);
        font-size: 14px;
      }
      a {
        color: #2dd4bf;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover {
        text-decoration: underline;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 48px;
        padding: 0 28px;
        margin-top: 28px;
        border-radius: 12px;
        background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
        color: #ffffff;
        font-weight: 600;
        font-size: 15px;
        text-decoration: none;
        box-shadow: 0 4px 20px rgba(20, 184, 166, 0.4);
        transition: all 0.2s;
      }
      .btn:hover {
        background: linear-gradient(135deg, #2dd4bf 0%, #14b8a6 100%);
        box-shadow: 0 6px 28px rgba(45, 212, 191, 0.5);
        transform: translateY(-1.5px);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="check-icon">✓</div>
      <h1>Demo Request Received!</h1>
      <p>Thank you for your interest in SmartDentist. Our team will contact you on WhatsApp / Phone shortly to schedule your live 1-on-1 clinic walkthrough.</p>
      
      <div class="contact-note">
        Have urgent questions? Email us directly at<br />
        <a href="mailto:alokkumar.in91@gmail.com">alokkumar.in91@gmail.com</a>
      </div>

      <a class="btn" href="/">← Return to Home</a>
    </div>
  </body>
</html>
